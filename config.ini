; ======================================================================
;  config.ini  -  sync_pcloud 2.1  (espejo carpeta local -> pCloud)
;  Los comentarios van SIEMPRE en su propia línea (empiezan por ; o #).
;  No pongas comillas en los valores.
; ======================================================================

[cuenta]
; ----------------------------------------------------------------------
;  CÓMO INICIA SESIÓN EL SCRIPT (en este orden):
;   1) token_manual: si lo rellenas, lo comprueba, lo pasa a "sesion" y
;      lo vacía.
;   2) sesion: el token guardado la última vez. Es lo normal: con esto
;      entra solo, también en modo --auto (Programador de tareas).
;   3) Si no hay sesión válida, inicia sesión de nuevo (solo a mano, sin
;      --auto):
;      - con OAuth si rellenas oauth_client_id / oauth_client_secret
;        (el login, con tu 2FA, se hace en el navegador);
;      - si no, con email + contraseña (sacados de key.ini si existe)
;        + código 2FA si tu cuenta lo tiene.
; ----------------------------------------------------------------------

; Tu email de pCloud (se propone cuando se pide el email).
usuario = tu_email@ejemplo.com

; Token de sesión que guarda el propio script, cifrado con DPAPI de
; Windows (solo tu usuario de Windows en este PC puede descifrarlo).
; No hace falta tocarlo. Dura hasta 2 años y caduca si pasan 62 días
; sin usarse. Para forzar un nuevo inicio de sesión, déjalo vacío.
sesion =

; Token pegado a mano (por ejemplo, el "auth" de tu sesión del navegador).
; En la siguiente ejecución se comprueba, se guarda cifrado en "sesion" y
; esta línea se vacía sola.
token_manual =

; ---- KEY.INI (opcional): para no escribir email y contraseña en consola ----
; Créalo TÚ con el Bloc de notas, junto a este config.ini, con dos líneas:
;     1ª línea: tu email de pCloud
;     2ª línea: tu contraseña
; - Si key.ini existe, el script coge de ahí email y contraseña.
; - Si no existe, te los pide en la consola.
; - El script solo lo LEE: nunca lo crea ni lo modifica.
; - Tras el primer login correcto la sesión queda guardada en "sesion"
;   (cifrada), así que puedes BORRAR key.ini; ya no hace falta.
; - Con 2FA el código se sigue pidiendo en la consola.

; Centro de datos de tu cuenta: eu (Luxemburgo), us (EE. UU.) o auto
region = auto

; ---- Alternativa OAuth (para cuentas con 2FA) ----
; Registra una app en https://docs.pcloud.com/my_apps/ y pon aquí su
; client_id y client_secret. Entonces el login se hace en el navegador.
oauth_client_id =
oauth_client_secret =

[opciones]
; Cómo decidir si un fichero es "el mismo":
;   tamano -> misma ruta y nombre + mismo tamaño exacto en bytes (rápido)
;   sha1   -> además compara el SHA-1 local con el que calcula pCloud en su
;             servidor, sin descargar nada (usa caché: cache_sha1.json).
comparar = sha1

; Cuántos ficheros se suben a la vez. 1 = uno a uno. 3 = de tres en tres.
subidas_paralelas = 3

; Tras subir cada fichero, comprobar que el SHA-1 que calcula pCloud es el
; de lo enviado. Si no coincide, se borra en la nube y se vuelve a subir.
verificar_subidas = si
; Intentos por fichero si la verificación falla.
intentos_por_fichero = 2

; Pasadas completas por ejecución. Tras la 1ª se vuelve a comparar todo;
; si nube y local coinciden se termina, si no se sube lo que falte.
; 3 = sincroniza + hasta 2 comprobaciones. 1 = sin comprobación final.
pasadas_maximas = 2

; si = solo muestra lo que haría, sin tocar la nube (igual que --simular)
simular = no

; Límite de seguridad: si una pasada fuese a borrar en la nube más
; ficheros que este número, aborta sin tocar nada. 0 = sin límite.
; (Si la carpeta local está vacía se borra todo lo de la nube, siempre
; que no supere este límite.)
max_borrados = 200

; Ficheros/carpetas que se ignoran en AMBOS lados (ni se suben ni se borran).
; Separados por ;  Comodines * y ?. Sin "/" se compara con el nombre;
; con "/" se compara con la ruta relativa (ej: Obra/temp/*).
excluir = Thumbs.db; desktop.ini; ~$*; *.tmp; .DS_Store

; Peticiones simultáneas de checksum a pCloud (solo en modo sha1)
hilos_checksum = 8

; Fichero de log (junto al script). Vacío = sin log en fichero.
log = sync_pcloud.log

; Tamaño máximo del log en MB. Al arrancar, si lo supera, se guarda como
; sync_pcloud.log.1 (el .1 pasa a .2, etc.) y se empieza uno nuevo.
; 0 = no rotar nunca.
log_max_mb = 10
; Cuántas copias antiguas se guardan (.1, .2, .3). 0 = simplemente se vacía.
log_copias = 3


; ----------------------------------------------------------------------
;  CARPETAS A REPLICAR: una sección [sync NOMBRE] por cada pareja
;  carpeta local -> carpeta en pCloud. Pon todas las que quieras.
;    local  = carpeta de tu PC
;    remota = carpeta en pCloud (se crea si no existe)
;  Reglas (si no se cumplen, el programa avisa y NO hace nada):
;    - Cada NOMBRE distinto: [sync Fotos], [sync Obra]...
;    - Nunca remota = /  (la raíz de pCloud).
;    - Cada remota en una carpeta propia: ni repetida ni una DENTRO de
;      otra. MAL: /Backup y /Backup/Fotos   BIEN: /Backup/Docs y /Backup/Fotos
;      (la de fuera vería a la de dentro como sobrante y la borraría).
;  Se procesan una detrás de otra, en el orden en que aparecen aquí, y al
;  final sale un RESUMEN con el resultado de cada una. max_borrados se
;  aplica a cada carpeta por separado.
; ----------------------------------------------------------------------
[sync Documentos]
local = D:\Documentos
remota = /Backup/Documentos

; [sync Fotos]
; local = E:\Fotos
; remota = /Backup/Fotos

; [sync Obra]
; local = D:\Obra
; remota = /Backup/Obra
